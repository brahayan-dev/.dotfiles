---
- name: Install Dependencies
  become: true
  community.general.pacman:
    name:
      - fd
      - git
      - zsh
      - 0ad
      - gcc
      - npm
      - curl
      - tree
      - tidy
      - make
      - cmake
      - shfmt
      - unzip
      - pdftk
      - nodejs
      - neovim
      - stylua
      - duckdb
      - pandoc
      - dbeaver
      - ghostty
      - lazygit
      - base-devel
      - github-cli
      - shellcheck
      - ruff
      - ttf-fira-code
      - poppler-glib
      - jupyter-notebook
      - lua-language-server

    state: latest
    update_cache: true
  notify:
    - event_download_ohmyzsh
    - event_install_ohmyzsh

- name: Install Ollama
  become: true
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: "/usr/local/bin/ollama"
