---
- name: Install Dependencies
  become: true
  ansible.builtin.dnf:
    name:
      - fd-find
      - git
      - zsh
      - 0ad
      - gcc
      - npm
      - curl
      - tree
      - tidy
      - make
      - cmake
      - shfmt
      - unzip
      - pdftk-java
      - nodejs
      - neovim
      - stylua
      - duckdb
      - pandoc
      - dbeaver
      - ghostty
      - lazygit
      - "@development-tools"
      - gh
      - ShellCheck
      - ruff
      - fira-code-fonts
      - poppler-glib
      - python3-notebook
      - lua-language-server

    state: latest
    update_cache: true
  notify:
    - event_download_ohmyzsh
    - event_install_ohmyzsh

- name: Install Ollama
  become: true
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: "/usr/local/bin/ollama"
