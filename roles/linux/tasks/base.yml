---
- name: Install Dependencies
  become: true
  community.general.pacman:
    name:
      - fd
      - git
      - zsh
      - gcc
      - curl
      - tree
      - tidy
      - make
      - cmake
      - shfmt
      - unzip
      - pdftk
      - sqlite
      - neovim
      - stylua
      - duckdb
      - rlwrap
      - direnv
      - pandoc
      - dbeaver
      - ghostty
      - ripgrep
      - lazygit
      - opentofu
      - base-devel
      - github-cli
      - shellcheck
      - ttf-fira-code
      - jdk-openjdk
      - lua-language-server
      - nodejs
      - npm
      - clojure
    state: latest
    update_cache: true
  notify:
    - event_download_ohmyzsh
    - event_install_ohmyzsh

- name: Install Npm Dependencies
  become: true
  community.general.npm:
    name: "{{ item }}"
    global: true
    force: true
    state: latest
  loop: "{{ npm_global_packages }}"

- name: Install Cljfmt
  become: true
  shell: curl -fsSL https://raw.githubusercontent.com/weavejester/cljfmt/HEAD/install.sh | bash
  args:
    creates: "/usr/local/bin/cljfmt"

- name: Install Clojure Lsp
  become: true
  shell: curl -fsSL https://raw.githubusercontent.com/clojure-lsp/clojure-lsp/master/install | bash
  args:
    creates: "/usr/local/bin/clojure-lsp"

- name: Clone Fennel Lsp
  ansible.builtin.git:
    repo: https://git.sr.ht/~xerool/fennel-ls
    dest: "{{ ansible_facts['user_dir'] }}/.local/src/fennel-ls"
    depth: 1

- name: Build Fennel Lsp
  ansible.builtin.command: make install PREFIX={{ ansible_facts['user_dir'] }}/.local
  args:
    chdir: "{{ ansible_facts['user_dir'] }}/.local/src/fennel-ls"
    creates: "{{ ansible_facts['user_dir'] }}/.local/bin/fennel-ls"

- name: Install Ollama
  become: true
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: "/usr/local/bin/ollama"

- name: Install Opencode
  shell: curl -fsSL https://opencode.ai/install | bash
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/bin/opencode"
