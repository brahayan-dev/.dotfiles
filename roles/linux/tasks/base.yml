---
- name: Install Dependencies
  become: true
  community.general.pacman:
    name:
      - fd
      - git
      - zsh
      - gcc
      - curl
      - tree
      - tidy
      - make
      - cmake
      - shfmt
      - unzip
      - pdftk
      - sqlite
      - neovim
      - rlwrap
      - direnv
      - pandoc
      - dbeaver
      - ghostty
      - ripgrep
      - lazygit
      - luajit
      - luarocks
      - opentofu
      - base-devel
      - github-cli
      - shellcheck
      - stylua
      - ttf-fira-code
      - lua-language-server
    state: latest
    update_cache: true
  notify:
    - event_download_ohmyzsh
    - event_install_ohmyzsh

- name: Install Brave
  shell: curl -fsS https://dl.brave.com/install.sh | sh
  args:
    creates: "/usr/bin/brave-browser"

- name: Install Ohmyzsh
  block:
    - name: Install Ohmyzsh - Download Installer
      get_url:
        url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
        dest: /tmp/ohmyzsh.sh
        mode: 0777
    - name: Install Ohmyzsh - Run Installer
      shell: |
        echo "Y" | sh /tmp/ohmyzsh.sh
      args:
        creates: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
