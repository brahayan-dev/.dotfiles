---
- name: Install Dependencies
  become: "{{ ansible_facts['os_family'] == 'Archlinux' }}"
  package:
    name:
      - lua
      - qpdf
      - luajit
      - fnlfmt
      - fennel
      - podman
      - poppler
      - ripgrep
      - tree-sitter-cli
    state: latest

- name: Install Markitdown
  pip:
    name: "markitdown[all]"
    state: latest
    extra_args: --user
