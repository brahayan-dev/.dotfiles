---
- name: Install Dependencies
  become: "{{ ansible_facts['os_family'] == 'Archlinux' }}"
  package:
    name:
      - go
      - tree-sitter-cli
    state: latest

- name: Install Golang LSP
  shell: go install golang.org/x/tools/gopls@latest
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.go/bin/gopls"

- name: Install Golang Imports
  shell: go install golang.org/x/tools/cmd/goimports@latest
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.go/bin/goimports"

- name: Install Mise
  shell: curl https://mise.run | sh
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/bin/mise"
