---
- name: Install Dependencies (MacOS)
  package:
    name:
      - node
      - podman
      - podman-compose
      - tree-sitter-cli
    state: latest
  when: "{{ ansible_facts['os_family'] == 'Darwin' }}"

- name: Install Dependencies (Linux)
  become: true
  package:
    name:
      - npm
      - nodejs
      - podman
      - podman-compose
      - tree-sitter-cli
    state: latest
  when: "{{ ansible_facts['os_family'] == 'Linux' }}"

- name: Install Mise
  shell: curl https://mise.run | sh
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/bin/mise"

- name: Install Npm Dependencies
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  community.general.npm:
    name: "{{ item }}"
    global: true
    force: true
    state: latest
  loop:
    - prettier
    - stylelint
    - typescript
    - elm
    - elm-format
    - elm-test
    - http-server
    - js-beautify
    - bash-language-server
    - yaml-language-server
    - typescript-language-server
    - vscode-langservers-extracted
    - "@rescript/language-server"
    - "@github/copilot-language-server"
    - "@elm-tooling/elm-language-server"
    - "@ansible/ansible-language-server"

- name: Configure Luarocks For LuaJIT
  shell: luarocks config --local lua_version 5.1
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.luarocks/config-5.1.lua"
