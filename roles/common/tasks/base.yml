---
- name: Install Dependencies
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  package:
    name:
      - lua
      - qpdf
      - luajit
      - podman
      - poppler
      - ripgrep
      - tree-sitter-cli
      - rlwrap
      - direnv
      - sqlite
      - opentofu
      - visidata
    state: latest

- name: Install Npm Dependencies
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  ansible.builtin.command:
    cmd: "npm install --global {{ npm_global_packages | join(' ') }}"
  changed_when: false
