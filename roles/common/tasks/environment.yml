---
- name: Create Directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: 0755
  loop:
    - .ssh
    - .config
    - .claude
    - .config/opencode
    - .config/ghostty

- name: Set Editor Symlinks
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/.dotfiles/files/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}"
    state: link
    force: true
  loop:
    - nvim
  notify: event_reload_zsh_files

- name: Transpile Fennel
  shell: >
    nvim --headless
    -c "lua vim.secure.trust({action='allow', path='.nfnl.fnl'})"
    -c "lua require('nfnl.api')['compile-all-files'](vim.fn.getcwd())"
    -c "qa"
  args:
    chdir: "{{ ansible_facts['user_dir'] }}/.config/nvim"

- name: Set Symlinks
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/.dotfiles/files/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: link
    force: true
  loop:
    - .zprofile
    - .zshrc
  notify: event_reload_zsh_files
