---
- name: Install Dependencies
  community.general.homebrew:
    name:
      - tofu-ls
      - jupyterlab
      - dbeaver-community
    state: latest

- name: Install Common Cask Dependencies
  community.general.homebrew_cask:
    name:
      - balenaetcher
    state: latest

- name: Install Markitdown
  pip:
    name: "markitdown[all]"
    state: latest
    extra_args: --user
