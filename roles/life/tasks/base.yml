---
- name: Enable Repositories On Brew
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop:
    - anomalyco/tap

- name: Install Dependencies
  community.general.homebrew:
    name:
      - direnv
      - sqlite
      - tofu-ls
      - opencode
      - opentofu
      - dbeaver-community
    state: latest
