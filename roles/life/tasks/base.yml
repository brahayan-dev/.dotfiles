---
- name: Enable Repositories On Brew
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop:
    - anomalyco/tap
    - d12frosted/emacs-plus

- name: Install Dependencies
  community.general.homebrew:
    name:
      - direnv
      - sqlite
      - tofu-ls
      - opencode
      - opentofu
      - emacs-plus@30
      - dbeaver-community
    state: latest
